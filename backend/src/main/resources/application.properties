# Default to H2 for local development/testing
spring.datasource.url=${VE_MAILER_JDBC_URL:jdbc:h2:file:./data/notificationdb}
spring.datasource.driverClassName=${VE_MAILER_JDBC_DRIVER:org.h2.Driver}
spring.datasource.username=${VE_MAILER_JDBC_USERNAME:sa}
spring.datasource.password=${VE_MAILER_JDBC_PASSWORD:password}
spring.jpa.database-platform=${VE_MAILER_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.h2.console.enabled=true

# Hibernate
spring.jpa.show-sql=true
spring.flyway.enabled=true

# Application
spring.application.name=veemailer
veemailer.query.limit=25

# CORS
app.cors.allowed-origins=${VE_MAILER_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:80,http://localhost}

# Authentication
app.auth.allowed-domains=${VE_MAILER_AUTH_ALLOWED_DOMAINS:company.com,int-company.com}
app.auth.allow-multiple-sessions=${VE_MAILER_AUTH_ALLOW_MULTIPLE_SESSIONS:false}
app.auth.jwt.secret=${VE_MAILER_AUTH_JWT_SECRET:YourSuperSecretKeyForJWTSigningMustBeAtLeast256BitsLong2024!}
app.auth.jwt.access-token-expiration-ms=${VE_MAILER_AUTH_JWT_ACCESS_TOKEN_EXPIRATION_MS:900000}
app.auth.jwt.refresh-token-expiration-ms=${VE_MAILER_AUTH_JWT_REFRESH_TOKEN_EXPIRATION_MS:604800000}

# Admin Bootstrap
app.bootstrap.admin.email=${VE_MAILER_BOOTSTRAP_ADMIN_EMAIL:admin@company.com}
app.bootstrap.admin.password=${VE_MAILER_BOOTSTRAP_ADMIN_PASSWORD:ChangeMeImmediately}
app.bootstrap.admin.name=${VE_MAILER_BOOTSTRAP_ADMIN_NAME:System Administrator}

# Optional: PostgreSQL profile (activated via SPRING_PROFILES_ACTIVE=prod)
