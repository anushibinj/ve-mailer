# Default to PostgreSQL for local development/testing
spring.datasource.url=${VE_MAILER_JDBC_URL:jdbc:postgresql://localhost:5432/vemailerdb}
spring.datasource.driverClassName=${VE_MAILER_JDBC_DRIVER:org.postgresql.Driver}
spring.datasource.username=${VE_MAILER_JDBC_USERNAME:postgres}
spring.datasource.password=${VE_MAILER_JDBC_PASSWORD:postgres}
spring.jpa.database-platform=${VE_MAILER_JPA_DATABASE_PLATFORM:org.hibernate.dialect.PostgreSQLDialect}

# Hibernate
# spring.jpa.show-sql=true
spring.flyway.enabled=true

# Application
spring.application.name=veemailer
veemailer.query.limit=25
veemailer.octane.ui-bundle-field-names=${VE_MAILER_OCTANE_UI_BUNDLE_FIELD_NAMES:product_udf}
veemailer.issues.max-screenshot-bytes=${VE_MAILER_ISSUES_MAX_SCREENSHOT_BYTES:1048576}
veemailer.issues.max-upload-bytes=${VE_MAILER_ISSUES_MAX_UPLOAD_BYTES:5242880}
spring.servlet.multipart.max-file-size=${VE_MAILER_ISSUES_MULTIPART_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${VE_MAILER_ISSUES_MULTIPART_MAX_REQUEST_SIZE:10MB}

# CORS
app.cors.allowed-origins=${VE_MAILER_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:80,http://localhost}
app.frontend.url=${VE_MAILER_FRONTEND_URL:http://localhost:5173}

# Authentication
app.auth.allowed-domains=${VE_MAILER_AUTH_ALLOWED_DOMAINS:company.com,int-company.com}
app.auth.allow-multiple-sessions=${VE_MAILER_AUTH_ALLOW_MULTIPLE_SESSIONS:false}
app.auth.jwt.secret=${VE_MAILER_AUTH_JWT_SECRET:YourSuperSecretKeyForJWTSigningMustBeAtLeast256BitsLong2024!}
app.auth.jwt.access-token-expiration-ms=${VE_MAILER_AUTH_JWT_ACCESS_TOKEN_EXPIRATION_MS:900000}
app.auth.jwt.refresh-token-expiration-ms=${VE_MAILER_AUTH_JWT_REFRESH_TOKEN_EXPIRATION_MS:604800000}
app.auth.invite-link.expiration-minutes=${VE_MAILER_AUTH_INVITE_LINK_EXPIRATION_MINUTES:10}
app.auth.invite-link.base-resend-seconds=${VE_MAILER_AUTH_INVITE_LINK_BASE_RESEND_SECONDS:30}

# Admin Bootstrap
app.bootstrap.admin.email=${VE_MAILER_BOOTSTRAP_ADMIN_EMAIL:admin@company.com}
app.bootstrap.admin.password=${VE_MAILER_BOOTSTRAP_ADMIN_PASSWORD:ChangeMeImmediately}
app.bootstrap.admin.name=${VE_MAILER_BOOTSTRAP_ADMIN_NAME:System Administrator}

# Optional: PostgreSQL profile (activated via SPRING_PROFILES_ACTIVE=prod)
# spring.datasource.url=jdbc:postgresql://localhost:5432/notificationdb
# spring.datasource.driverClassName=org.postgresql.Driver
# spring.datasource.username=postgres
# spring.datasource.password=postgres
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Spring AI configuration is now database-backed and managed through the Admin Control Panel.
# No spring.ai.openai.* properties are required here.

# Actuator — expose only the health endpoint; show full details so HEALTHCHECK can verify UP status
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
