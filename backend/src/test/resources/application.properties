# Use an in-memory H2 database for tests so they never conflict with a running backend instance
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true

# Recreate schema on every test run
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Flyway — disabled for tests; H2 in-memory schema is managed by Hibernate
spring.flyway.enabled=false

# Authentication test config
app.auth.allowed-domains=company.com,int-company.com
app.auth.allow-multiple-sessions=false
app.auth.jwt.secret=TestSecretKeyForJWTSigningMustBeAtLeast256BitsLongForTests2024!
app.auth.jwt.access-token-expiration-ms=900000
app.auth.jwt.refresh-token-expiration-ms=604800000

# Admin Bootstrap
app.bootstrap.admin.email=admin@company.com
app.bootstrap.admin.password=Admin@123
app.bootstrap.admin.name=Test Administrator

# Spring AI — dummy key for test context (actual AI calls are mocked in unit tests)
spring.ai.openai.api-key=test-dummy-key
spring.ai.openai.base-url=https://api.openai.com
spring.ai.openai.chat.options.model=gpt-4.1-mini
