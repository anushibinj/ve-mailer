# Profile for integration tests against the local PostgreSQL container (docker-compose)
spring.datasource.url=jdbc:postgresql://localhost:5432/vemailerdb
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Use create-drop so tests get a fresh schema and don't pollute the database
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Disable Flyway for these tests — Hibernate DDL manages the schema
spring.flyway.enabled=false

# Authentication (required by AppConfig)
app.auth.allowed-domains=company.com,int-company.com
app.auth.allow-multiple-sessions=false
app.auth.jwt.secret=TestSecretKeyForJWTSigningMustBeAtLeast256BitsLongForTests2024!
app.auth.jwt.access-token-expiration-ms=900000
app.auth.jwt.refresh-token-expiration-ms=604800000

# Admin Bootstrap
app.bootstrap.admin.email=admin@company.com
app.bootstrap.admin.password=Admin@123
app.bootstrap.admin.name=Test Administrator
